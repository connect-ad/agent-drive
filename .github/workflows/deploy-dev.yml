name: Deploy dev

on:
  push:
    branches: [dev]

# Serialise deploys to an environment, and never cancel one mid-apply: an
# interrupted apply can leave Terraform state locked or infra half-created.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: Development
      workspace: dev
    secrets: inherit
