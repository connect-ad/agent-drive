name: Deploy (reusable)

# Dev and prod deploy through THIS one workflow, parameterised only by inputs.
# That is deliberate: the roadmap calls for prod to be "identical in shape" to
# dev, and the reliable way to guarantee that is to make it literally the same
# code path, rather than two files that drift apart over time.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name (Development or Production).
        required: true
        type: string
      workspace:
        description: Terraform workspace and resource environment (dev or prod).
        required: true
        type: string

permissions:
  contents: read
  deployments: write

env:
  TERRAFORM_VERSION: "1.16.1"

jobs:
  # A broken build must never reach real infrastructure - not even dev.
  #
  # This job, rather than a required status check on the dev branch, is how that
  # is enforced. Required status checks on a branch also block direct pushes to
  # it (a freshly pushed commit has not passed checks yet), which would break the
  # push-to-dev-and-auto-deploy loop the roadmap is built around. Gating the
  # deploy instead keeps pushes fast while still refusing to ship a red build.
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy ${{ inputs.workspace }}
    needs: verify
    runs-on: ubuntu-latest
    # This is what makes the Production required-reviewer gate actually block:
    # the job does not start until a reviewer approves.
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      WORKSPACE: ${{ inputs.workspace }}
      ENVIRONMENT_NAME: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Verify required secrets are present
        run: |
          set -euo pipefail
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TF_VAR_zone_id AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the $ENVIRONMENT_NAME environment:$missing"
            exit 1
          fi
          echo "All required infrastructure secrets are present."

      - name: Write Terraform backend config
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          printf 'endpoints = {\n  s3 = "https://%s.r2.cloudflarestorage.com"\n}\n' "$CLOUDFLARE_ACCOUNT_ID" > backend.hcl

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Select Terraform workspace
        working-directory: infra/terraform
        run: terraform workspace select -or-create "$WORKSPACE"

      # Workspace selection is mutable CLI state. Assert it landed where we
      # think before anything is applied. This is the check that stops a
      # mis-selected workspace from applying dev intent to prod resources.
      - name: Assert workspace
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          actual="$(terraform workspace show)"
          if [ "$actual" != "$WORKSPACE" ]; then
            echo "::error::Workspace is '$actual' but this job deploys '$WORKSPACE'. Refusing to apply."
            exit 1
          fi
          echo "Workspace confirmed: $actual"

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve -input=false -lock-timeout=5m

      - name: Capture Terraform outputs
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          terraform output -json > "$RUNNER_TEMP/tf-outputs.json"
          reported="$(terraform output -raw environment)"
          if [ "$reported" != "$WORKSPACE" ]; then
            echo "::error::State reports environment '$reported', expected '$WORKSPACE'."
            exit 1
          fi
          echo "API_URL=$(terraform output -raw api_url)" >> "$GITHUB_ENV"
          echo "D1_NAME=$(terraform output -raw d1_database_name)" >> "$GITHUB_ENV"

      - name: Install app dependencies
        working-directory: apps/api
        run: npm ci

      - name: Inject Terraform resource IDs into wrangler.toml
        working-directory: apps/api
        run: node scripts/apply-tf-outputs.mjs "$WORKSPACE" "$RUNNER_TEMP/tf-outputs.json"

      # Secrets reach Cloudflare here and ONLY here, never through Terraform,
      # whose state is plaintext. Piped via stdin so no value is ever an
      # argument in a process list or a workflow log.
      - name: Push Worker secrets
        working-directory: apps/api
        env:
          DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          for name in DATABASE_ENCRYPTION_KEY SESSION_SIGNING_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing application secret $name in the $ENVIRONMENT_NAME environment."
              exit 1
            fi
            printf '%s' "${!name}" | npx wrangler secret put "$name" --env "$WORKSPACE"
            echo "Set $name"
          done

      # Migrations run BEFORE the code deploy so new code never meets an old
      # schema. This assumes additive, backward-compatible migrations, which is
      # the standard the design docs already set.
      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote --env "$WORKSPACE"

      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy --env "$WORKSPACE"

      - name: Smoke test
        working-directory: apps/api
        run: node scripts/smoke-test.mjs "$API_URL" "$WORKSPACE"

      - name: Report result
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Deploy to $WORKSPACE succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- API: ${API_URL:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deploy to $WORKSPACE FAILED (${{ job.status }})" >> "$GITHUB_STEP_SUMMARY"
          fi
