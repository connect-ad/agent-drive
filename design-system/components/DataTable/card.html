<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>DataTable</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:28px;background:var(--paper)}.demo{display:flex;flex-direction:column;gap:22px}.demo__row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { DataTable, Panel, Badge, FileCell, IconButton, Icon } = window.AgentStorageMcp_d311bf;
function Demo(){
const cols=[
 {key:'name',header:'Name',primary:true,render:r=><FileCell name={r.name} kind={r.kind} agentWritten={r.agent}/>},
 {key:'type',header:'Type',width:120,render:r=><span className="ad-mono-sm">{r.type}</span>},
 {key:'size',header:'Size',align:'right',width:96,mono:true},
 {key:'v',header:'Versions',align:'right',width:88,mono:true},
 {key:'mod',header:'Modified',width:150,render:r=><span style={{color:'var(--ink-3)'}}>{r.mod}</span>},
 {key:'a',header:'',width:40,render:()=><IconButton icon={<Icon name="more" size={14}/>} label="Row actions"/>}
];
const rows=[
 {id:1,name:'market-sizing.pdf',type:'application/pdf',size:'4.2 MB',v:3,mod:'12 minutes ago',agent:true},
 {id:2,name:'interviews',kind:'folder',type:'folder',size:'\u2014',v:'\u2014',mod:'2 hours ago'},
 {id:3,name:'competitors.json',type:'application/json',size:'88 KB',v:11,mod:'Yesterday, 18:40',agent:true},
 {id:4,name:'pricing-notes.md',type:'text/markdown',size:'12 KB',v:1,mod:'3 Mar 2026'}
];
return (<div className="demo">
<Panel flush title="Files"><DataTable columns={cols} rows={rows} onRowClick={()=>{}}/></Panel>
<Panel flush title="Loading"><DataTable columns={cols.slice(0,5)} rows={[]} loading skeletonRows={3}/></Panel>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
