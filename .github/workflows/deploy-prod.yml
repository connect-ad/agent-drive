name: Deploy prod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    # Runs under the Production GitHub Environment, so the required-reviewer
    # rule gates it. Never bypass or self-approve that gate: it is the only
    # thing between a merged PR and live customer data.
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    secrets: inherit
